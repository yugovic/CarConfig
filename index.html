<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaguar Configurator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="canvas-container"></div>
        
        <div class="top-bar">
            <div class="logo">
                <span>Jaguar Configurator</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn" id="shareLink" title="構成をリンクで共有" aria-label="構成をリンクで共有">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
                </button>
                <button class="icon-btn" id="screenshotBtn" title="スクリーンショットを保存" aria-label="スクリーンショットを保存">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </button>
                <div class="dev-menu-wrap">
                    <button class="icon-btn" id="devMenuBtn" title="詳細設定" aria-label="詳細設定">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                    </button>
                    <div class="dev-menu" id="devMenu">
                        <button data-action="camera-editor">カメラエディター <kbd>Shift+E</kbd></button>
                        <button data-action="garage">ガレージ設定 <kbd>Shift+G</kbd></button>
                    </div>
                </div>
                <button class="movie-btn-top" id="playMovieTop" title="プレゼンテーション" aria-label="プレゼンテーション">
                    <span class="movie-icon"><svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></span>
                </button>
            </div>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <aside class="spec-panel" id="specPanel"></aside>
        
        <div class="movie-progress-top" id="movieProgressTop">
            <div class="progress-bar"></div>
        </div>
        
        <div class="configurator-container">
            <div class="hover-trigger"></div>
            <div class="tab-navigation">
                <button class="tab-btn active" data-tab="models">
                    <span>モデル</span>
                </button>
                <button class="tab-btn" data-tab="exterior">
                    <span>カラー</span>
                </button>
                <button class="tab-btn" data-tab="details">
                    <span>ディテール</span>
                </button>
                <button class="tab-btn" data-tab="environment">
                    <span>環境</span>
                </button>
                <button class="tab-btn" data-tab="camera">
                    <span>ビュー</span>
                </button>
            </div>
            
            <div class="tab-content">
                <div class="tab-panel active" id="models-panel">
                    <h2 class="panel-title">モデルを選択</h2>
                    <div class="model-grid">
                        <!-- src/config.js の CARS から生成 -->
                    </div>
                </div>
            
                <div class="tab-panel" id="exterior-panel">
                    <div class="option-row">
                        <h2 class="panel-title">エクステリアカラー</h2>
                        <div class="color-selection">
                            <div class="color-grid">
                                <!-- src/config.js の COLORS から生成 -->
                            </div>
                            <div class="custom-color">
                                <label for="bodyColorPicker">カスタム</label>
                                <input type="color" id="bodyColorPicker" class="color-picker" value="#0b3a2a">
                            </div>
                        </div>
                    </div>
                    <div class="option-row">
                        <h2 class="panel-title">塗装仕上げ</h2>
                        <div class="pill-row finish-options"></div>
                    </div>
                </div>

                <div class="tab-panel" id="details-panel">
                    <div class="option-row">
                        <h2 class="panel-title">ホイール</h2>
                        <div class="pill-row wheel-options"></div>
                    </div>
                    <div class="option-row">
                        <h2 class="panel-title">ガラス</h2>
                        <div class="pill-row glass-options"></div>
                    </div>
                </div>

                <div class="tab-panel" id="environment-panel">
                    <div class="option-row">
                        <h2 class="panel-title">背景</h2>
                        <div class="pill-row env-options"></div>
                    </div>
                    <div class="option-row">
                        <h2 class="panel-title">画質</h2>
                        <label class="switch-field">
                            <input type="checkbox" id="qualityToggle">
                            <span>高画質（アンビエントオクルージョン・ブルーム・SMAA）</span>
                        </label>
                    </div>
                </div>
            
                <div class="tab-panel" id="camera-panel">
                    <h2 class="panel-title">ビューコントロール</h2>
                    <div class="view-controls">
                        <div class="view-presets">
                            <button class="view-btn" data-view="front">
                                <span>フロント</span>
                            </button>
                            <button class="view-btn" data-view="side">
                                <span>サイド</span>
                            </button>
                            <button class="view-btn" data-view="rear">
                                <span>リア</span>
                            </button>
                            <button class="view-btn" data-view="top">
                                <span>トップ</span>
                            </button>
                        </div>
                        <label class="switch-field">
                            <input type="checkbox" id="autoRotateToggle" checked>
                            <span>操作がないときに自動回転</span>
                        </label>
                        
                        <div class="movie-section">
                            <h3>プレゼンテーション</h3>
                            <button class="movie-btn modern" id="playMovie">
                                <span class="movie-icon"><svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></span>
                                <span class="movie-text">ムービー再生</span>
                            </button>
                            <div class="movie-progress">
                                <div class="progress-bar" id="movieProgress"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- カメラエディターモーダル -->
        <div class="editor-modal" id="editorModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>カメラエディター</h2>
                    <button class="modal-close" id="closeModal">
                        ×
                    </button>
                </div>
                <div class="modal-body">
                    <div class="editor-container">
                        <div class="editor-canvas-wrapper">
                            <canvas id="cameraEditor2D" width="400" height="200"></canvas>
                            <p class="editor-hint">キャンバスをクリックしてカメラパスを設定</p>
                        </div>
                        
                        <div class="editor-settings">
                            <div class="settings-group">
                                <h3>高さ設定</h3>
                                <div class="slider-field">
                                    <label>始点高さ</label>
                                    <input type="range" id="cameraStartHeight" min="0.1" max="5" step="0.1" value="1.5">
                                    <span class="value-display" id="startHeightValue">1.5m</span>
                                </div>
                                <div class="slider-field">
                                    <label>終点高さ</label>
                                    <input type="range" id="cameraEndHeight" min="0.1" max="5" step="0.1" value="1.5">
                                    <span class="value-display" id="endHeightValue">1.5m</span>
                                </div>
                            </div>
                            
                            <div class="settings-group">
                                <h3>アニメーション設定</h3>
                                <div class="slider-field">
                                    <label>速度</label>
                                    <input type="range" id="cameraSpeed" min="0.5" max="5" step="0.1" value="1">
                                    <span class="value-display" id="speedValue">1.0x</span>
                                </div>
                                <div class="select-field">
                                    <label>補間タイプ</label>
                                    <select id="interpolationType">
                                        <option value="linear">リニア</option>
                                        <option value="easeInOut">イーズイン・アウト</option>
                                        <option value="easeIn">イーズイン</option>
                                        <option value="easeOut">イーズアウト</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="settings-group">
                                <h3>カメラ設定</h3>
                                <div class="slider-field">
                                    <label>視野角(FOV)</label>
                                    <input type="range" id="cameraFOVEditor" min="20" max="100" step="1" value="30">
                                    <span class="value-display" id="cameraFOVEditorValue">30°</span>
                                </div>
                            </div>
                            
                            <div class="settings-group">
                                <h3>カメラの向き</h3>
                                <div class="select-field">
                                    <label>モード</label>
                                    <select id="cameraLookMode">
                                        <option value="lookAtCar">車を見る</option>
                                        <option value="lookForward">進行方向を見る</option>
                                        <option value="parallel">平行移動</option>
                                        <option value="angle">角度指定</option>
                                    </select>
                                </div>
                                <div id="angleControls" style="display: none;">
                                    <div class="slider-field">
                                        <label>パン角度</label>
                                        <input type="range" id="cameraPan" min="-180" max="180" step="1" value="0">
                                        <span class="value-display" id="panValue">0°</span>
                                    </div>
                                    <div class="slider-field">
                                        <label>チルト角度</label>
                                        <input type="range" id="cameraTilt" min="-90" max="90" step="1" value="0">
                                        <span class="value-display" id="tiltValue">0°</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="action-buttons">
                                <button class="action-btn secondary" id="clearPath">
                                    クリア
                                </button>
                                <button class="action-btn primary" id="previewPath">
                                    プレビュー
                                </button>
                                <button class="action-btn success" id="applyPath">
                                    適用
                                </button>
                            </div>
                            
                            <div class="preset-manager">
                                <h3>プリセット</h3>
                                <div class="preset-buttons">
                                    <button class="preset-btn" id="preset1" title="サイド">
                                        1
                                    </button>
                                    <button class="preset-btn" id="preset2" title="リア">
                                        2
                                    </button>
                                    <button class="preset-btn" id="preset3" title="フロント">
                                        3
                                    </button>
                                    <button class="action-btn secondary small" id="savePreset">
                                        保存
                                    </button>
                                </div>
                            </div>
                            
                            <div class="status-bar">
                                <p id="editorStatus">始点を選択してください</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- ガレージ設定モーダル -->
        <div class="garage-modal" id="garageModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>ガレージ設定</h2>
                    <button class="modal-close" id="closeGarageModal">
                        ×
                    </button>
                </div>
                <div class="modal-body">
                    <div class="garage-settings-container">
                        <div class="settings-group">
                            <h3>ガレージ調整</h3>
                            <div class="slider-field">
                                <label>スケール</label>
                                <input type="range" id="garageScale" min="0.05" max="1.0" step="0.01" value="0.5">
                                <span class="value-display" id="garageScaleValue">0.50x</span>
                            </div>
                            <div class="slider-field">
                                <label>高さ</label>
                                <input type="range" id="garageHeight" min="-2" max="2" step="0.1" value="0.6">
                                <span class="value-display" id="garageHeightValue">0.6m</span>
                            </div>
                            <div class="slider-field">
                                <label>X位置</label>
                                <input type="range" id="garageX" min="-5" max="5" step="0.1" value="1.3">
                                <span class="value-display" id="garageXValue">1.3m</span>
                            </div>
                            <div class="slider-field">
                                <label>Z位置</label>
                                <input type="range" id="garageZ" min="-5" max="5" step="0.1" value="1.0">
                                <span class="value-display" id="garageZValue">1.0m</span>
                            </div>
                            <div class="slider-field">
                                <label>回転</label>
                                <input type="range" id="garageRotation" min="-180" max="180" step="1" value="0">
                                <span class="value-display" id="garageRotationValue">0°</span>
                            </div>
                            <div class="slider-field">
                                <label>影床の高さ</label>
                                <input type="range" id="shadowFloorY" min="-0.5" max="0.5" step="0.01" value="0.03">
                                <span class="value-display" id="shadowFloorYValue">0.03m</span>
                            </div>
                        </div>
                        
                        <div class="settings-group">
                            <h3>カメラ設定</h3>
                            <div class="slider-field">
                                <label>視野角(FOV)</label>
                                <input type="range" id="cameraFOV" min="20" max="100" step="1" value="30">
                                <span class="value-display" id="cameraFOVValue">30°</span>
                            </div>
                        </div>
                        
                        <div class="action-buttons">
                            <button class="action-btn secondary" id="resetGarage">
                                リセット
                            </button>
                            <button class="action-btn primary" id="applyGarage">
                                適用
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="loading-screen" id="loading">
            <div class="spinner"></div>
            <p>モデルを読み込み中...</p>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
